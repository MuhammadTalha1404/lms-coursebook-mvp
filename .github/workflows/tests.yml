name: Coursebook tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_root_only
          MYSQL_DATABASE: lms_test
          MYSQL_USER: lms_test
          MYSQL_PASSWORD: ci_test_only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_root_only --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      RUN_MYSQL_TESTS: "1"
      LMS_TEST_HOST: 127.0.0.1
      LMS_TEST_DATABASE: lms_test
      LMS_TEST_USER: lms_test
      LMS_TEST_PASSWORD: ci_test_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
