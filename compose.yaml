services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Generate .env with scripts/docker_env.py first}
      MYSQL_DATABASE: ${DB_NAME:-lms}
      MYSQL_USER: ${DB_USER:-lms_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Generate .env with scripts/docker_env.py first}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-lms}
      DB_USER: ${DB_USER:-lms_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      INSTITUTE_NAME: ${INSTITUTE_NAME:-Learning & Training Institute}
      APP_CURRENCY: ${APP_CURRENCY:-PKR}
      APP_DATA_MODE: ${APP_DATA_MODE:-live}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
    ports:
      - "127.0.0.1:8501:8501"
volumes:
  mysql_data:
